<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme-Off &mdash; Buzzer</title>
<script>
  // Apply the saved theme before first paint (dark is the default)
  (function () {
    var t = 'dark';
    try { var s = localStorage.getItem('memeoff-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── THEMES ── dark (default) and light (pale-blue slide look) ── */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0B1B2E;       --surface: #112640;   --surface2: #17314F;  --surface3: #1E3D5F;
    --border: #2A4D73;   --text: #E8F3FD;      --title: #BBDAF3;     --muted: #86A9C7;
    --primary: #5B9BD0;  --primary-hi: #86BCE6; --primary-lo: #2F6FA8;
    --accent: #8FBCE0;   --score: #A8D1F0;   --brand: #5B9BD0;
    --good: #4BDE9C;     --bad: #FF7A7A;
    --blob1: #5B9BD02B;  --blob2: #8FBCE018;   --grid: #8FBCE00C;
    --shadow: #00000066; --ambient-op: 0.14;
    --btn-late-hi: #2B4663;   --btn-late-lo: #1A2F46;   --btn-late-text: #5F7F9E;
    --btn-lock-hi: #16304B;   --btn-lock-lo: #0F2238;   --btn-lock-text: #3D5F80;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F0F9FF;       --surface: #FFFFFF;   --surface2: #E6F3FC;  --surface3: #D6EAF8;
    --border: #BFD9EC;   --text: #2A5272;      --title: #43749A;     --muted: #587F9C;
    --primary: #43749A;  --primary-hi: #719FBF; --primary-lo: #365F80;
    --accent: #719FBF;   --score: #43749A;   --brand: #5E91B7;
    --good: #1E9E6A;     --bad: #D8504A;
    --blob1: #9DC2DE8C;  --blob2: #719FBF4D;   --grid: #43749A0F;
    --shadow: #43749A40; --ambient-op: 0.10;
    --btn-late-hi: #C8DCEB;   --btn-late-lo: #A9C5DB;   --btn-late-text: #6C8DA6;
    --btn-lock-hi: #E1EEF8;   --btn-lock-lo: #CFE3F2;   --btn-lock-text: #8FAEC6;
  }
  :root {
    --primary-soft: color-mix(in srgb, var(--primary) 14%, transparent);
    --primary-line: color-mix(in srgb, var(--primary) 40%, transparent);
    --primary-glow: color-mix(in srgb, var(--primary) 38%, transparent);
    --good-soft:    color-mix(in srgb, var(--good) 12%, transparent);
    --good-line:    color-mix(in srgb, var(--good) 40%, transparent);
    --good-glow:    color-mix(in srgb, var(--good) 40%, transparent);
    --accent-soft:  color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-line:  color-mix(in srgb, var(--accent) 45%, transparent);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    transition: background 0.25s, color 0.25s;
  }

  /* Soft grid + corner blobs (echoes the slide look) */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 420px 320px at -80px -50px, var(--blob1), transparent 70%),
      radial-gradient(ellipse 340px 380px at calc(100% + 60px) 6%, var(--blob2), transparent 70%),
      radial-gradient(ellipse 400px 300px at calc(100% + 40px) 100%, var(--blob1), transparent 70%),
      radial-gradient(ellipse 300px 260px at -40px 100%, var(--blob2), transparent 70%);
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed; right: 14px; bottom: 14px; z-index: 300;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); color: var(--title);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px var(--shadow); transition: transform 0.15s, background 0.25s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 20px; height: 20px; }
  :root[data-theme="dark"]  .theme-toggle .i-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .i-sun  { display: none; }

  /* Ambient glow behind buzzer */
  .ambient {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: var(--ambient-op);
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--primary);
    transition: background 0.5s, opacity 0.5s;
    z-index: 0;
  }
  .ambient.open { background: var(--primary); animation: ambientPulse 2s infinite; }
  .ambient.winner { opacity: 0.3; background: var(--good); }
  .ambient.late { opacity: 0.08; background: var(--muted); }
  @keyframes ambientPulse { 0%,100%{opacity:0.16} 50%{opacity:0.28} }

  /* ── JOIN SCREEN ── */
  .join-screen {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 0;
    padding: 20px;
  }

  .join-eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--muted);
    margin-bottom: 12px;
    text-align: center;
  }

  .join-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 13vw, 120px);
    color: var(--title);
    letter-spacing: 0.07em;
    white-space: nowrap;
    line-height: 0.9;
    margin-bottom: 8px;
    text-align: center;
  }

  .join-title span {
    color: var(--brand);
    text-shadow: 0 0 40px var(--primary-glow);
  }

  .join-subtitle {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    text-align: center;
  }

  .join-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }

  .join-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .join-label svg { width: 14px; height: 14px; }

  .join-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 600;
    padding: 16px 20px;
    border-radius: 12px;
    outline: none;
    text-align: center;
    letter-spacing: 6px;
    text-transform: uppercase;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }
  .join-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .join-input::placeholder { color: var(--muted); font-size: 14px; letter-spacing: 3px; font-weight: 400; opacity: 0.8; }
  .join-input.shake { animation: shake 0.4s; border-color: var(--bad); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

  .join-btn {
    background: var(--primary);
    border: none;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 24px var(--primary-glow);
  }
  .join-btn:hover { background: var(--primary-lo); transform: translateY(-2px); box-shadow: 0 8px 32px var(--primary-glow); }
  .join-btn:active { transform: translateY(0); }

  .join-error {
    color: var(--bad);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    letter-spacing: 0.5px;
  }
  .join-error.info { color: var(--muted); }

  /* ── GAME SCREEN ── */
  .game-screen {
    display: none;
    position: relative;
    z-index: 10;
    min-height: 100vh;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 70%, transparent);
    backdrop-filter: blur(10px);
  }

  .topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .event-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--title);
    white-space: nowrap;
  }

  .event-name span { color: var(--brand); }

  .round-pill {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: var(--primary-soft);
    border: 1px solid var(--primary-line);
    padding: 4px 14px;
    border-radius: 99px;
    color: var(--primary);
    white-space: nowrap;
  }

  .team-pill {
    font-size: 11px;
    letter-spacing: 2px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    padding: 4px 12px;
    border-radius: 99px;
    color: var(--text);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 38vw;
  }

  .leave-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 99px;
    cursor: pointer;
  }
  .leave-btn:hover { color: var(--text); border-color: var(--accent-line); }

  /* Main content */
  .game-content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
  }

  /* Buzzer area */
  .buzzer-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px;
  }

  /* The big buzzer */
  .buzzer-outer {
    position: relative;
    width: min(280px, 72vw);
    height: min(280px, 72vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .buzzer-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: all 0.3s;
  }

  .buzzer-ring.ready {
    border-color: var(--primary);
    box-shadow: 0 0 0 8px var(--primary-glow), 0 0 60px var(--primary-glow);
    animation: ringPulse 1.5s infinite;
  }
  .buzzer-ring.winner { border-color: var(--good); box-shadow: 0 0 0 8px var(--good-glow), 0 0 60px var(--good-glow); }
  .buzzer-ring.late { border-color: var(--border); }
  .buzzer-ring.locked { border-color: var(--border); }

  @keyframes ringPulse {
    0%,100% { box-shadow: 0 0 0 8px var(--primary-glow), 0 0 60px var(--primary-glow); }
    50% { box-shadow: 0 0 0 16px var(--primary-soft), 0 0 80px var(--primary-glow); }
  }

  .buzzer-btn {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 9vw, 42px);
    letter-spacing: 6px;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    z-index: 1;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    background: radial-gradient(circle at 35% 35%, var(--primary-hi), var(--primary-lo));
    color: #fff;
    box-shadow:
      0 12px 40px var(--shadow),
      inset 0 2px 4px #ffffff55,
      inset 0 -4px 8px #00000033;
  }

  .buzzer-btn:hover:not(:disabled) {
    transform: scale(1.04) translateY(-4px);
    box-shadow: 0 20px 60px var(--shadow), 0 0 40px var(--primary-glow), inset 0 2px 4px #ffffff55;
  }

  .buzzer-btn:active:not(:disabled) {
    transform: scale(0.96) translateY(2px);
    box-shadow: 0 4px 16px var(--shadow), inset 0 4px 8px #00000044;
  }

  .buzzer-btn.winner {
    background: radial-gradient(circle at 35% 35%, #69f0ae, #00897b);
    box-shadow: 0 12px 40px var(--shadow), 0 0 60px var(--good-glow), inset 0 2px 4px #ffffff55;
    animation: winnerBounce 0.5s ease;
    cursor: default;
  }

  .buzzer-btn.late {
    background: radial-gradient(circle at 35% 35%, var(--btn-late-hi), var(--btn-late-lo));
    color: var(--btn-late-text);
    cursor: not-allowed;
    box-shadow: 0 8px 24px var(--shadow), inset 0 2px 4px #ffffff22;
  }

  .buzzer-btn.locked {
    background: radial-gradient(circle at 35% 35%, var(--btn-lock-hi), var(--btn-lock-lo));
    color: var(--btn-lock-text);
    cursor: not-allowed;
    box-shadow: 0 4px 16px var(--shadow), inset 0 2px 4px #ffffff11;
  }

  @keyframes winnerBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* Status text */
  .status-text {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: center;
    min-height: 24px;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .status-text.ready { color: var(--primary); font-weight: 600; }
  .status-text.winner { color: var(--good); font-weight: 700; font-size: 20px; }
  .status-text.late { color: var(--muted); }

  /* Buzz result display */
  .buzz-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 24px;
    min-width: min(280px, 86vw);
    text-align: center;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .buzz-display.has-winner {
    border-color: var(--good-line);
    background: color-mix(in srgb, var(--good) 8%, var(--surface));
  }

  .buzz-winner-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .buzz-winner-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--good);
    letter-spacing: 3px;
    text-shadow: 0 0 20px var(--good-glow);
  }

  .buzz-order-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }

  .buzz-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .buzz-pill.first { background: var(--good-soft); border-color: var(--good-line); color: var(--good); }

  /* ── RIGHT PANEL - SCOREBOARD ── */
  .scoreboard-panel {
    border-left: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 55%, transparent);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 16px;
    overflow-y: auto;
  }

  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--muted);
  }

  .sb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    transition: all 0.2s;
  }

  .sb-row.me {
    border-color: var(--primary-line);
    background: color-mix(in srgb, var(--primary) 10%, var(--surface));
  }

  .sb-row.leader {
    border-color: var(--accent-line);
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  }

  .sb-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--muted);
    min-width: 24px;
    text-align: center;
  }
  .sb-rank.gold { color: var(--primary); }

  .sb-info { flex: 1; min-width: 0; }

  .sb-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .sb-name.me-name { color: var(--primary); }

  .sb-buzz-tag {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .sb-buzz-tag.first { color: var(--good); }

  .sb-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--score);
    min-width: 36px;
    text-align: right;
  }

  /* Flash overlay for buzz */
  .flash-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .flash-overlay.flash-green { background: var(--good); animation: flashAnim 0.4s ease; }
  .flash-overlay.flash-red   { background: var(--primary); animation: flashAnim 0.3s ease; }
  @keyframes flashAnim { 0%{opacity:0.4} 100%{opacity:0} }

  /* Waiting state empty scoreboard */
  .sb-empty {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    padding: 20px 0;
  }

  /* ── Phones ── */
  @media (max-width: 800px) {
    .game-content { grid-template-columns: 1fr; }
    .scoreboard-panel { border-left: none; border-top: 1px solid var(--border); }
    .buzzer-area { padding: 28px 16px; gap: 24px; }
    .topbar { padding: 12px 16px; flex-wrap: wrap; row-gap: 8px; }
    .topbar-left, .topbar-right { flex-wrap: nowrap; }
    .topbar-right { margin-left: auto; }
    .team-pill { max-width: 46vw; }
    .event-name { font-size: 19px; letter-spacing: 3px; }
    .scoreboard-panel { padding-bottom: 84px; }   /* keeps rows clear of the theme button */
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch light/dark theme" title="Switch theme">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<div class="ambient" id="ambient"></div>
<div class="flash-overlay" id="flash"></div>

<!-- JOIN SCREEN: locked until a valid team code is entered -->
<div class="join-screen" id="join-screen">
  <div class="join-eyebrow">Inceptia Fest &mdash; Round 3</div>
  <div class="join-title">MEME<span>-OFF</span></div>
  <div class="join-subtitle">Buzzer Beater Challenge</div>
  <div class="join-form">
    <div class="join-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Enter your team code
    </div>
    <input class="join-input" id="team-input" placeholder="TEAM CODE" maxlength="14"
           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
    <button class="join-btn" onclick="joinGame()">ENTER ARENA</button>
    <div class="join-error" id="join-error"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="game-screen" id="game-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="event-name">MEME<span>-OFF</span></div>
      <div class="round-pill" id="round-pill">Round 1</div>
    </div>
    <div class="topbar-right">
      <div class="team-pill" id="team-pill"></div>
      <button class="leave-btn" onclick="leaveTeam()" title="Use a different team code">Leave</button>
    </div>
  </div>

  <div class="game-content">
    <!-- Buzzer area -->
    <div class="buzzer-area">
      <div class="buzzer-outer">
        <div class="buzzer-ring locked" id="buzzer-ring"></div>
        <button class="buzzer-btn locked" id="buzzer-btn" onpointerdown="buzz()" onclick="buzz()">BUZZ</button>
      </div>

      <div class="status-text" id="status-text">Waiting for host...</div>

      <div class="buzz-display" id="buzz-display">
        <div class="buzz-winner-label">No buzz yet</div>
      </div>
    </div>

    <!-- Scoreboard panel -->
    <div class="scoreboard-panel">
      <div class="panel-title">Scoreboard</div>
      <div id="scoreboard-rows">
        <div class="sb-empty">Waiting for teams...</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── THEME ──
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('memeoff-theme', next); } catch (e) {}
  }

  // ── ENTRY (team code gate) ──
  let ws = null, myTeam = null, myCode = null, gameState = null;
  let entered = false, autoJoin = false, intentionalClose = false, reconnectTimer = null;

  function cleanCode(s) { return s.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12); }

  function saveCode(c)  { try { sessionStorage.setItem('memeoff-code', c); } catch (e) {} }
  function clearCode()  { try { sessionStorage.removeItem('memeoff-code'); } catch (e) {} }

  function showJoinMsg(text, isError) {
    const el = document.getElementById('join-error');
    el.textContent = text;
    el.className = 'join-error' + (isError ? '' : ' info');
    if (isError) {
      const input = document.getElementById('team-input');
      input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    }
  }

  function backToJoin(message) {
    entered = false;
    gameState = null;
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('join-screen').style.display = '';
    document.getElementById('ambient').className = 'ambient';
    showJoinMsg(message || '', !!message);
  }

  function joinGame() {
    const code = cleanCode(document.getElementById('team-input').value);
    if (code.length < 4) { showJoinMsg('Enter your team code.', true); return; }
    myCode = code;
    autoJoin = false;
    showJoinMsg('Checking code…', false);
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'join', code: myCode })); return; }
    if (ws && ws.readyState === 0) return;           // still connecting: onopen sends the latest code
    intentionalClose = false;
    connectWS();
  }

  document.getElementById('team-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinGame();
  });

  function leaveTeam() {
    intentionalClose = true;
    clearTimeout(reconnectTimer);
    clearCode();
    myCode = null; myTeam = null;
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    document.getElementById('team-input').value = '';
    backToJoin('');
  }

  function connectWS() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const sock = new WebSocket(`${proto}//${location.host}/ws`);
    ws = sock;

    sock.onopen = () => { if (myCode) sock.send(JSON.stringify({ type: 'join', code: myCode })); };

    sock.onmessage = e => {
      let data;
      try { data = JSON.parse(e.data); } catch (_) { return; }

      if (data.type === 'joined') {
        entered = true;
        myTeam = data.team;
        saveCode(myCode);
        document.getElementById('join-error').textContent = '';
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('team-pill').textContent = myTeam;
      } else if (data.type === 'join_error') {
        if (entered || autoJoin) { clearCode(); myCode = null; backToJoin(data.msg || 'Could not enter.'); }
        else showJoinMsg(data.msg || 'Could not enter.', true);
      } else if (data.type === 'kicked') {
        clearCode(); myCode = null;
        backToJoin(data.msg || 'You were removed.');
      } else if (data.type === 'state') {
        const prev = gameState;
        gameState = data.state;
        // Flash once, when the very first buzz of a question lands
        if (prev && prev.buzz_order.length === 0 && gameState.buzz_order.length > 0) {
          triggerFlash(gameState.buzz_order[0] === myTeam ? 'green' : 'red');
        }
        updateUI();
      }
    };

    sock.onclose = () => {
      if (sock !== ws || intentionalClose) return;   // replaced, or we left on purpose
      if (entered) document.getElementById('status-text').textContent = 'Reconnecting…';
      else showJoinMsg('Connecting…', false);
      reconnectTimer = setTimeout(connectWS, 2000);
    };
  }

  function buzz() {
    if (!entered || !gameState || gameState.locked) return;
    if (gameState.buzz_order.includes(myTeam)) return;
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'buzz' }));       // the server knows which team this device is
  }

  function triggerFlash(color) {
    const el = document.getElementById('flash');
    el.className = `flash-overlay flash-${color}`;
    setTimeout(() => el.className = 'flash-overlay', 400);
  }

  function updateUI() {
    if (!gameState) return;
    const myData = gameState.teams[myTeam];
    const btn = document.getElementById('buzzer-btn');
    const ring = document.getElementById('buzzer-ring');
    const status = document.getElementById('status-text');
    const ambient = document.getElementById('ambient');

    document.getElementById('round-pill').textContent = `Round ${gameState.round}`;

    const buzzed = gameState.buzz_order.length > 0;
    const iFirst = myData?.rank === 1;
    const iLate  = myData?.rank > 1;

    if (iFirst) {
      btn.className = 'buzzer-btn winner'; ring.className = 'buzzer-ring winner';
      btn.textContent = '1ST!';
      status.className = 'status-text winner'; status.textContent = 'You buzzed first!';
      ambient.className = 'ambient winner';
    } else if (iLate) {
      btn.className = 'buzzer-btn late'; ring.className = 'buzzer-ring late';
      btn.textContent = `#${myData.rank}`;
      status.className = 'status-text late'; status.textContent = `You were #${myData.rank}`;
      ambient.className = 'ambient late';
    } else if (gameState.locked && buzzed) {
      btn.className = 'buzzer-btn late'; ring.className = 'buzzer-ring late';
      btn.textContent = 'BUZZ';
      status.className = 'status-text late'; status.textContent = `${gameState.buzz_order[0]} got it`;
      ambient.className = 'ambient late';
    } else if (!gameState.locked) {
      btn.className = 'buzzer-btn'; ring.className = 'buzzer-ring ready';
      btn.textContent = 'BUZZ!';
      status.className = 'status-text ready'; status.textContent = 'GO!';
      ambient.className = 'ambient open';
    } else {
      btn.className = 'buzzer-btn locked'; ring.className = 'buzzer-ring locked';
      btn.textContent = 'BUZZ';
      status.className = 'status-text'; status.textContent = 'Waiting for host...';
      ambient.className = 'ambient';
    }

    // Buzz display
    const bd = document.getElementById('buzz-display');
    if (gameState.buzz_order.length > 0) {
      bd.className = 'buzz-display has-winner';
      bd.innerHTML = `
        <div class="buzz-winner-label">First buzz</div>
        <div class="buzz-winner-name">${gameState.buzz_order[0]}</div>
        <div class="buzz-order-pills">
          ${gameState.buzz_order.map((n,i) =>
            `<div class="buzz-pill ${i===0?'first':''}">#${i+1} ${n}</div>`
          ).join('')}
        </div>`;
    } else {
      bd.className = 'buzz-display';
      bd.innerHTML = `<div class="buzz-winner-label">No buzz yet</div>`;
    }

    renderScoreboard();
  }

  function renderScoreboard() {
    const teams = Object.entries(gameState.teams || {})
      .sort((a,b) => b[1].score - a[1].score);
    const el = document.getElementById('scoreboard-rows');
    if (!teams.length) { el.innerHTML = `<div class="sb-empty">Waiting for teams...</div>`; return; }
    el.innerHTML = teams.map(([name, data], i) => {
      const buzzIdx = gameState.buzz_order.indexOf(name);
      const isMe = name === myTeam;
      const isLeader = i === 0;
      return `<div class="sb-row ${isMe?'me':''} ${isLeader&&!isMe?'leader':''}">
        <div class="sb-rank ${i===0?'gold':''}">${i+1}</div>
        <div class="sb-info">
          <div class="sb-name ${isMe?'me-name':''}">${name}${isMe?' (you)':''}</div>
          ${buzzIdx>=0 ? `<div class="sb-buzz-tag ${buzzIdx===0?'first':''}">${buzzIdx===0?'buzzed first':`#${buzzIdx+1} buzz`}</div>` : ''}
        </div>
        <div class="sb-score">${data.score}</div>
      </div>`;
    }).join('');
  }

  // Page reload / brief tab close: re-enter automatically with the code used earlier in this tab
  (function resume() {
    let saved = null;
    try { saved = sessionStorage.getItem('memeoff-code'); } catch (e) {}
    if (saved && cleanCode(saved).length >= 4) {
      myCode = cleanCode(saved);
      autoJoin = true;
      showJoinMsg('Reconnecting…', false);
      connectWS();
    }
  })();
</script>
</body>
</html>
